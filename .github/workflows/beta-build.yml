name: Web and server regression
on:
  push:
    branches: [beta, feature/monad-testnet-contracts, feature/monad-auto-payout]
  pull_request:
    branches: [main, beta]

jobs:
  web-and-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install frontend dependencies
        working-directory: web
        run: npm install --no-audit --no-fund
      - name: Verify frontend TypeScript and production build
        working-directory: web
        run: npm run build
      - name: Test synchronized countdown independently of laptop wall clocks
        working-directory: web
        run: npm test
      - name: Install backend dependencies
        working-directory: race-server
        run: npm install --no-audit --no-fund
      - name: Check backend syntax
        working-directory: race-server
        run: node --check server.js
      - name: Run server-authoritative marble simulation test
        working-directory: race-server
        run: npm test
