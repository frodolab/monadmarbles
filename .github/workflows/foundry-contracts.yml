name: Foundry contracts
on:
  push:
    branches:
      - feature/monad-testnet-contracts
      - feature/monad-auto-payout
    paths:
      - "contracts/**"
      - ".github/workflows/foundry-contracts.yml"
  pull_request:
    branches:
      - beta
    paths:
      - "contracts/**"
      - ".github/workflows/foundry-contracts.yml"

jobs:
  solidity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Build contract
        working-directory: contracts
        run: forge build
      - name: Run contract tests
        working-directory: contracts
        run: forge test -vv
      - name: Export contract ABI for frontend and backend integration
        working-directory: contracts
        run: |
          mkdir -p abi
          forge inspect src/MonadMarbles.sol:MonadMarbles abi --json > abi/MonadMarbles.json
          forge inspect src/MonadMarblesAuto.sol:MonadMarblesAuto abi --json > abi/MonadMarblesAuto.json
      - name: Upload ABI artifact
        uses: actions/upload-artifact@v4
        with:
          name: MonadMarbles-ABI
          path: contracts/abi/*.json
          retention-days: 14
